name: Deploy Astro Site to GitHub Pages

on:
  # Allow manual triggering of this workflow
  workflow_dispatch:
  # Allow triggering of this workflow externally
  repository_dispatch:
    types: [deploy-astro]

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  setup:
    name: Set up the target repository
    runs-on: ubuntu-latest
    # Need to also store it in the environment because the variable is not
    #   refreshed between steps
    outputs:
      repo: ${{ steps.parse.outputs.repo }}
    steps:
        # Store the repository source to the repository variable
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set repository name and build type
        id: parse
        run: |
          if [[ -n "${{ github.event.client_payload.repository }}" ]]; then
            echo "repo=${{ github.event.client_payload.repository }}" >> \
              $GITHUB_OUTPUT
            gh variable set REPOSITORY_SOURCE --body \
              "${{ github.event.client_payload.repository }}"
          else
            echo "No repository source specified"
            if [[ -n "${{ vars.BUILD_TYPE }}" ]]; then
              if [[ "${{ vars.BUILD_TYPE }}" != "astro" ]]; then
                echo "Previous build type is not astro"
                exit 1
              fi
            fi
            echo "repo=${{ vars.REPOSITORY_SOURCE }}" >> $GITHUB_OUTPUT
          fi
          gh variable set BUILD_TYPE --body "astro"
        env:
          GH_TOKEN: ${{ secrets.PAT }}
  build:
    name: Build Astro site
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your site repository
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.setup.outputs.repo }}
          token: ${{ secrets.PAT }}
      - name: Install, build, and upload your site
        uses: withastro/action@v3
        # with:
          # path: . # The root location of your Astro project inside the repository. (optional)
          # node-version: 20 # The specific version of Node that should be used to build your site. Defaults to 20. (optional)
          # package-manager: pnpm@latest # The Node package manager that should be used to install dependencies and build your site. Automatically detected based on your lockfile. (optional)

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
